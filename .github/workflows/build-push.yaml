name: build-and-push

# A merged PR is itself a push to main, so this covers both cases.
on:
  push:
    branches: [main]

# Don't run two image builds for main at the same time.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    uses: yama6a/gha/.github/workflows/docker-build-release.yaml@v2
    permissions:
      contents: write # required to create the GitHub release
      packages: write # required, or the image push fails with permission_denied
      id-token: write # mints the OIDC token the attestation is signed with
      attestations: write # stores the attestation

  # Publishing is only half a deploy: the cluster pins an exact tag, so bump it in the GitOps repo and
  # let ArgoCD sync.
  deploy:
    needs: build-push
    uses: yama6a/gha/.github/workflows/deploy-gitops.yaml@v2
    permissions: {} # DEPLOY_TOKEN carries the rights, nothing from this repo is needed
    with:
      tag: ${{ needs.build-push.outputs.version }}
      values-path: argo_apps/workloads/charts/tagesschau-reader/values.yaml
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
