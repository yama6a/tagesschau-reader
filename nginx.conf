# Cache-Control lives in a map rather than per-location add_header: an add_header inside a location
# block discards every header inherited from the server block, which would drop the security headers
# below. First matching entry wins.
map $uri $cache_control {
    default         "no-cache";
    ~^/assets/      "public, max-age=31536000, immutable"; # vite content-hashes these
}

server {
    listen 8080; # the unprivileged image cannot bind 80
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # connect-src: the page and article JSON of the tagesschau API.
    # img-src: teaser and gallery images. The hosts are the ones the API returned in November 2026.
    # media-src: MP4 and HLS video and MP3 audio of tagesschau and the regional ARD broadcasters.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://www.tagesschau.de; img-src 'self' data: https://images.tagesschau.de https://images.ndr.de https://images.mdr.de https://images.sportschau.de; media-src https://*.ard-mcdn.de https://adaptive.tagesschau.de https://adaptive.ndr.de https://vod.unified.mdr.de https://ondemand.unified.mdr.de https://wdradaptiv-vh.akamaihd.net https://srod-vh.akamaihd.net https://br-i.akamaihd.net https://srstorage01-a.akamaihd.net https://wdrmedien-a.akamaihd.net https://rbbvod.akamaized.net; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # TLS terminates at the ingress. The header still reaches the browser through it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $cache_control always;

    # Kubernetes probes, so they do not depend on the page content.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
