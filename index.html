<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c2841" />
    <title>Nachrichten</title>
    <link rel="icon" href="data:," />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="top">
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="news" aria-selected="true">Nachrichten</button>
        <button type="button" role="tab" data-tab="videos" aria-selected="false">Videos</button>
      </nav>
      <div id="news-bar" class="topbar">
        <button id="mark-all" type="button">Alle als gelesen markieren</button>
        <label class="switch">
          <input id="show-read" type="checkbox" role="switch" />
          Gelesene anzeigen
        </label>
        <button id="settings" type="button" aria-label="Einstellungen"></button>
      </div>
    </header>
    <main>
      <section id="news-view">
        <div id="refresh-status"></div>
        <div id="list"></div>
        <div id="sentinel"></div>
        <div id="status"></div>
      </section>
      <section id="videos-view" hidden>
        <div id="video-list"></div>
        <div id="video-sentinel"></div>
        <div id="video-status"></div>
      </section>
    </main>
    <dialog id="article" class="article" aria-label="Artikel"></dialog>
    <dialog id="onboarding" class="onboarding" aria-label="Einstellungen"></dialog>
  </body>
</html>
